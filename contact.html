<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Overkill Detailing</title>
  <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap)" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: url('images/random.jpg') center/cover no-repeat fixed; color: #fff; margin: 0; }
    header { background: rgba(0,0,0,0.8); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; }
    header img { height: 60px; }
    nav a { color: #fff; margin: 0 15px; text-decoration: none; font-weight: 500; }
    nav a:hover { color: #e40000; }
    section { background: rgba(0,0,0,0.8); max-width: 700px; margin: 120px auto; padding: 30px; border-radius: 10px; }
    h1 { text-align: center; color: #e40000; margin-bottom: 20px; }
    form { display: grid; gap: 15px; }
    input, textarea { width: 100%; padding: 10px; border-radius: 5px; border: none; font-size: 1rem; }
    textarea { resize: none; }
    button { background: #e40000; border: none; padding: 12px; color: #fff; font-size: 1rem; border-radius: 5px; cursor: pointer; }
    button:hover { background: #b30000; }
    .contact-info { text-align: center; margin-bottom: 20px; }
    footer { background: rgba(0,0,0,0.85); text-align: center; color: #bbb; padding: 25px; margin-top: 30px; }
  </style>
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Overkill Logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="packages.html">Packages</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <section>
    <h1>Contact & Booking</h1>
    <div class="contact-info">
      <p><strong>Text Josh to Book:</strong> +1 (954) 661‑2642</p>
      <p><strong>Email:</strong> Preynolds226@gmail.com</p>
      <p>Fill out the form below so we have your details before your appointment:</p>
    </div>
    <form>
      <input type="text" placeholder="Full Name" required>
      <input type="tel" placeholder="Phone Number" required>
      <input type="email" placeholder="Email Address" required>
      <input type="text" placeholder="Vehicle Make & Model" required>
      <textarea rows="4" placeholder="Requested Service or Notes"></textarea>
      <button type="submit">Submit (Layout Only)</button>
    </form>
  </section>
  <footer>
    <p>&copy; 2026 Overkill Detailing. All Rights Reserved.</p>
  </footer>
</body>
</html>
