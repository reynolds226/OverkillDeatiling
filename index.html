<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overkill Detailing | Luxury Auto Detailing in South Florida</title>
  <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;700&display=swap)" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #111; color: #eee; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 40px; background: #000; position: fixed; width: 100%; top: 0; left: 0; z-index: 1000;
    }
    header img { height: 60px; }
    nav a {
      color: #fff; text-decoration: none; margin: 0 15px; font-weight: 500; transition: 0.3s;
    }
    nav a:hover { color: #e40000; }
    .hero {
      height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: #000; text-align: center;
      overflow: hidden; position: relative;
    }
    .hero img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0; transition: opacity 1.5s ease-in-out;
    }
    .hero img.active { opacity: 0.4; }
    .hero-content {
      position: relative; z-index: 2; color: #fff;
    }
    .hero h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 4rem; color: #fff;
    }
    .hero p {
      font-size: 1.3rem; margin: 15px 0 30px; color: #ccc;
    }
    .cta {
      background: #e40000; color: #fff; padding: 12px 30px; border: none; border-radius: 5px;
      font-size: 1rem; cursor: pointer; transition: 0.3s;
    }
    .cta:hover { background: #b30000; }
    footer {
      background: #000; text-align: center; color: #777; padding: 30px 0; margin-top: 30px;
    }
  </style>
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Overkill Detailing Logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="packages.html">Packages</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <section class="hero">
    <img src="images/cover1.jpg" class="active" alt="Luxury Car Detailing">
    <img src="images/cover2.jpg" alt="Professional Car Wash">
    <div class="hero-content">
      <h1>Overkill Detailing</h1>
      <p>Luxury Mobile Auto Detailing — Broward to South Beach</p>
      <a href="packages.html"><button class="cta">View Our Packages</button></a>
    </div>
  </section>
  <footer>
    <p>&copy; 2026 Overkill Detailing. All Rights Reserved.</p>
  </footer>
  <script>
    const slides = document.querySelectorAll('.hero img');
    let i = 0;
    setInterval(() => {
      slides.forEach((s, idx) => s.classList.toggle('active', idx === i));
      i = (i + 1) % slides.length;
    }, 4000);
  </script>
</body>
</html>
